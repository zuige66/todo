<svg xmlns="http://www.w3.org/2000/svg" width="880" height="840" viewBox="0 0 880 840">
<rect width="880" height="840" fill="#ffffff"/>
<defs>
  <marker id="a2" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
    <path d="M0,0 L9,4.5 L0,9 z" fill="#000000"/>
  </marker>
</defs>
<style>
  text{font-family:"Microsoft YaHei","SimHei",sans-serif;}
  .n{font-size:13px;fill:#000000;}
  .s{font-size:11px;fill:#333333;}
  .box{fill:#fafafa;stroke:#000000;stroke-width:1.2;}
  .ln{stroke:#000000;stroke-width:1.3;fill:none;}
</style>

<rect class="box" x="290" y="24" width="300" height="50"/>
<text class="n" x="440" y="54" text-anchor="middle">用户输入一句话文本</text>

<line class="ln" x1="440" y1="74" x2="440" y2="104" marker-end="url(#a2)"/>

<rect class="box" x="270" y="106" width="340" height="56"/>
<text class="n" x="440" y="128" text-anchor="middle">全角归一化</text>
<text class="s" x="440" y="148" text-anchor="middle">全角数字 / 冒号 / 点号转半角，去多余空白</text>

<line class="ln" x1="440" y1="162" x2="440" y2="192" marker-end="url(#a2)"/>

<rect class="box" x="270" y="194" width="340" height="56"/>
<text class="n" x="440" y="216" text-anchor="middle">多日期切分（RangeMerge）</text>
<text class="s" x="440" y="236" text-anchor="middle">识别一句中的多个日期，拆成多条独立待办</text>

<line class="ln" x1="440" y1="250" x2="440" y2="280" marker-end="url(#a2)"/>

<rect class="box" x="230" y="282" width="420" height="72"/>
<text class="n" x="440" y="306" text-anchor="middle">日期解析（正则 + 中文词表，纯本地规则）</text>
<text class="s" x="440" y="326" text-anchor="middle">相对天 / 本周星期 / 下周星期 / 月日 / 日号 / 数字短日期</text>
<text class="s" x="440" y="344" text-anchor="middle">时间区间 / 周末 / 月界与年界 / 今年明年</text>

<line class="ln" x1="440" y1="354" x2="440" y2="384" marker-end="url(#a2)"/>

<rect class="box" x="230" y="386" width="420" height="72"/>
<text class="n" x="440" y="410" text-anchor="middle">时刻解析</text>
<text class="s" x="440" y="430" text-anchor="middle">HH:MM / X点 / X点半 / X点一刻 / 时段词默认时刻</text>
<text class="s" x="440" y="448" text-anchor="middle">时间区间继承起始时段词，跨午夜自动落到次日</text>

<line class="ln" x1="440" y1="458" x2="440" y2="488" marker-end="url(#a2)"/>

<rect class="box" x="230" y="490" width="420" height="72"/>
<text class="n" x="440" y="514" text-anchor="middle">重复与相对提醒识别</text>
<text class="s" x="440" y="534" text-anchor="middle">每天 / 每周 / 每月 / 每周X → 重复天数</text>
<text class="s" x="440" y="552" text-anchor="middle">马上 / 一会儿 / 待会儿 / 稍后 → 以当前时刻为锚</text>

<line class="ln" x1="440" y1="562" x2="440" y2="592" marker-end="url(#a2)"/>

<rect class="box" x="250" y="594" width="380" height="56"/>
<text class="n" x="440" y="616" text-anchor="middle">剩余文本切分</text>
<text class="s" x="440" y="636" text-anchor="middle">首个词为事件标题，其后全部为详情</text>

<line class="ln" x1="440" y1="650" x2="440" y2="680" marker-end="url(#a2)"/>

<rect class="box" x="230" y="682" width="420" height="72"/>
<text class="n" x="440" y="706" text-anchor="middle">合法性校验</text>
<text class="s" x="440" y="726" text-anchor="middle">本周已过的星期 → 报错；写死年份且已过 → 报错</text>
<text class="s" x="440" y="744" text-anchor="middle">仅写日号或月日且已过 → 静默顺延；只写时刻已过 → 顺延到明天</text>

<line class="ln" x1="440" y1="754" x2="440" y2="784" marker-end="url(#a2)"/>

<rect class="box" x="230" y="786" width="420" height="44"/>
<text class="n" x="440" y="814" text-anchor="middle">生成预览卡片 → 用户确认后写入数据库</text>
</svg>
