<rect class="box2" x="40" y="608" width="820" height="60"/>
<text class="n" x="450" y="632" text-anchor="middle">Android 系统运行时</text>
<text class="s" x="450" y="652" text-anchor="middle">AlarmManager · NotificationManager · AppWidgetHost · BroadcastReceiver · WorkManager · SQLite</text>
