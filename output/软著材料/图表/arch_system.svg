<rect class="box" x="666" y="76" width="182" height="72"/>
<text class="n" x="757" y="104" text-anchor="middle">设置·关于·隐私</text>
<text class="s" x="757" y="124" text-anchor="middle">Settings / About</text>
<text class="s" x="757" y="140" text-anchor="middle">PrivacyScreen</text>

