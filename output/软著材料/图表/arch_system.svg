<line class="ln" x1="665" y1="338" x2="665" y2="396" marker-end="url(#ar)"/>
<line class="ln" x1="673" y1="396" x2="673" y2="338" marker-end="url(#ar)"/>

<!-- 分区：数据持久层 -->
<rect class="zone" x="40" y="398" width="390" height="170"/>
