<rect class="box" x="262" y="76" width="182" height="72"/>
<text class="n" x="353" y="104" text-anchor="middle">一句话新增面板</text>
<text class="s" x="353" y="124" text-anchor="middle">AddSheet</text>
<text class="s" x="353" y="140" text-anchor="middle">实时解析预览</text>
<rect class="box" x="464" y="76" width="182" height="72"/>
<text class="n" x="555" y="104" text-anchor="middle">专注计时页</text>
<text class="s" x="555" y="124" text-anchor="middle">FocusScreen</text>
