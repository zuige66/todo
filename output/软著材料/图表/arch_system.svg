<svg xmlns="http://www.w3.org/2000/svg" width="900" height="700" viewBox="0 0 900 700">
<rect width="900" height="700" fill="#ffffff"/>
<defs>
  <marker id="ar" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
    <path d="M0,0 L9,4.5 L0,9 z" fill="#000000"/>
  </marker>
  <marker id="arS" markerWidth="9" markerHeight="9" refX="1" refY="4.5" orient="auto">
    <path d="M9,0 L0,4.5 L9,9 z" fill="#000000"/>
  </marker>
</defs>
<style>
  text{font-family:"Microsoft YaHei","SimHei",sans-serif;}
  .t{font-size:14px;fill:#000000;font-weight:bold;}
  .n{font-size:13px;fill:#000000;}
  .s{font-size:11px;fill:#333333;}
  .z{font-size:13px;fill:#333333;font-weight:bold;}
  .box{fill:#fafafa;stroke:#000000;stroke-width:1.2;}
  .box2{fill:#f5f5f5;stroke:#000000;stroke-width:1.2;}
  .zone{fill:none;stroke:#333333;stroke-width:1;stroke-dasharray:6 4;}
  .ln{stroke:#000000;stroke-width:1.3;fill:none;}
</style>

<!-- 分区：表现层 -->
<rect class="zone" x="40" y="40" width="820" height="126"/>
<text class="z" x="52" y="62">表现层 · Jetpack Compose 声明式界面</text>
<rect class="box" x="60" y="76" width="182" height="72"/>
<text class="n" x="151" y="104" text-anchor="middle">待办列表主页</text>
